  const vt = t.closest('.vtab');
  if(vt){ S.view = vt.dataset.view; S.enter = true; renderToolbar(); render(); return; }
  const stb = t.closest('[data-stab]');
  if(stb){ if(stb.dataset.stab !== S.settingsTab) showSettingsTab(stb.dataset.stab); return; }
  const stp = t.closest('[data-step]');
  if(stp){ const k = stp.dataset.step; changeSetting({[k]: Math.max(0, (S.settings[k] || 0) + Number(stp.dataset.d))}); return; }
  const tp = t.closest('.tpl[data-tpl]');
  if(tp){ if(S.ntf && (S.ntf.editor || S.ntf.tpl !== tp.dataset.tpl)){ Object.assign(S.ntf, {tpl:tp.dataset.tpl, text:null, editing:false, err:'', swap:true, editor:null}); renderNotify(); } return; }
  const vc = t.closest('[data-var]');
  if(vc){ insertVar(vc.dataset.var); return; }
  const a = t.closest('[data-action]'); if(!a) return;
  const act = a.dataset.action, id = a.dataset.id;
  if(act === 'open'){
    if(t.closest('select,button,a,input')) return;
    openDrawer(id);
  }
  else if(act === 'close'){ closeDrawer(); }
  else if(act === 'edit'){ S.editing = true; renderDrawer(); }
  else if(act === 'cancel-edit'){ S.editing = false; renderDrawer(); }
  else if(act === 'close-modal'){ closeModal(); }
  else if(act === 'settings'){ openSettings(); }
  else if(act === 'storage-refresh'){ loadStorage(); }
  else if(act === 'google'){ loginGoogle(a); }
  else if(act === 'toggle-burnout'){ changeSetting({burnout: !S.settings.burnout}); }
  else if(act === 'notify'){ openNotify(S.openId); }
  else if(act === 'ntf-edit'){ const tk = byId(S.ntf.taskId); S.ntf.text = S.ntf.text ?? fillTemplate(curTpl(), tk); S.ntf.editing = true; S.ntf.err = ''; renderNotify(); }
  else if(act === 'ntf-done'){ const ta = $('#ntf-text'); if(ta) S.ntf.text = ta.value; S.ntf.editing = false; renderNotify(); }
  else if(act === 'ntf-reset'){ Object.assign(S.ntf, {text:null, editing:false, err:'', swap:true}); renderNotify(); }
  else if(act === 'ntf-send'){ sendNotification(); }
  else if(act === 'tpl-new'){ openTplEditor(null); }
  else if(act === 'tpl-edit'){ openTplEditor(curTpl()); }
  else if(act === 'tpl-cancel'){ Object.assign(S.ntf, {editor:null, swap:true}); renderNotify(); }
  else if(act === 'tpl-save'){ saveTemplate(); }
  else if(act === 'tpl-delete'){ deleteTemplate(); }
  else if(act === 'copy-form'){
    try{ await navigator.clipboard.writeText(formUrl()); toast('Link do formulário copiado.'); }
    catch{ toast(formUrl()); }
  }
  else if(act === 'theme'){ toggleTheme(a); }
  else if(act === 'add-person'){ openAddPerson(); }
  else if(act === 'profile'){ openProfile(); }
  else if(act === 'remove-photo'){ removeAvatar(); }
  else if(act === 'toggle-active'){ const p = prof(id); if(p) updatePerson(id, {active: !p.active}); }
  else if(act === 'remove-person'){
    const p = prof(id);
    if(p && confirm(`Remover ${p.name}? As tarefas atribuídas ficam sem responsável.`)){
      const {error} = await sb.from('profiles').delete().eq('id', id);
      if(error) toast('Não foi possível remover: ' + error.message, 'err');
      await loadAll(); renderToolbar(); render();
    }
  }
  else if(act === 'delete-task'){
    const tk = byId(id);
    if(tk && confirm(`Excluir a solicitação "${tk.name}"? Essa ação não pode ser desfeita.`)){
      const {error} = await sb.from('tasks').delete().eq('id', id);
      if(error){ toast('Não foi possível excluir: ' + error.message, 'err'); return; }
      const paths = (tk.attachments||[]).map(x=>x.path);
      if(paths.length) await sb.storage.from('anexos').remove(paths);
      S.tasks = S.tasks.filter(x => x.id !== id); S.openId = null; render();
      toast('Solicitação excluída.');
    }
  }
});

/* ===================== ANIMACOES ===================== */
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function aAttr(t, i){
  let cls = '', st = `--i:${Math.min(i, 24)};`;
  if(S.flash && S.flash.id === t.id){
    const el = Date.now() - S.flash.t0;
    if(el < 1100){ cls = ' flash'; st += `animation-delay:-${el}ms;`; } else S.flash = null;
  }
  return {cls, st};
}

function countTo(el, to, suf=''){
  const from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  cancelAnimationFrame(Number(el.dataset.raf || 0));
  if(from === to || REDUCE){ el.textContent = to + suf; return; }
  const t0 = performance.now(), d = 750;
  const step = now => {
    const p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e) + suf;
    if(p < 1) el.dataset.raf = requestAnimationFrame(step);
  };
  el.dataset.raf = requestAnimationFrame(step);
}

function renderStats(){
  const box = $('#stats'); if(!box) return;
  box.hidden = S.view === 'equipe';
  const now = Date.now(), cut = now - 30*86400e3;
  const open = S.tasks.filter(t => t.status !== 'concluida');
  const late = open.filter(t => new Date(t.due_at).getTime() < now);
  const done = S.tasks.filter(t => t.status === 'concluida' && new Date(t.completed_at || t.updated_at).getTime() > cut);
  const ontime = done.filter(t => new Date(t.completed_at || t.updated_at) <= new Date(t.due_at));
  const pct = done.length ? Math.round(ontime.length / done.length * 100) : 0;
  const vals = {
    open:   [open.length, S.tasks.length ? open.length / S.tasks.length : 0, ''],
    late:   [late.length, open.length ? late.length / open.length : 0, ''],
    done:   [done.length, (done.length + open.length) ? done.length / (done.length + open.length) : 0, ''],
    ontime: [pct, pct / 100, '%']
  };
  for(const k in vals){
    const v = box.querySelector(`[data-k="${k}"]`), bar = box.querySelector(`[data-b="${k}"]`);
    countTo(v, vals[k][0], vals[k][2]);
    void bar.offsetWidth;
    bar.style.width = (vals[k][1] * 100).toFixed(1) + '%';
  }
  box.querySelector('.s-late').classList.toggle('hot', late.length > 0);
}

/* ===================== ARMAZENAMENTO ===================== */
const fmtBytes = b => {
  b = Number(b) || 0;
  if(b >= GB) return String(+(b / GB).toFixed(b >= 10 * GB ? 0 : 2)).replace('.', ',') + ' GB';
  if(b >= MB) return (b / MB).toFixed(b >= 100 * MB ? 0 : 1).replace('.', ',') + ' MB';
  return Math.max(0, Math.round(b / 1024)) + ' KB';
};
const BUCKET_LABEL = {anexos:'Anexos das solicitações', avatares:'Fotos de perfil'};
const TABLE_LABEL = {tasks:'Solicitações', notifications:'Histórico de notificações', profiles:'Equipe', settings:'Configurações', avatars:'Fotos (registro)'};

function storagePane(){
  return `<div class="h3-row"><h3>Armazenamento</h3><span class="spacer"></span>
      <button type="button" class="btn sm" data-action="storage-refresh" id="st-refresh">${I.refresh} Atualizar</button></div>
    <p class="lead">Quanto do espaço do projeto no Supabase (plano gratuito) já foi usado. Quando um dos limites é atingido, o Supabase passa a recusar novos dados.</p>
    <div id="st-body">${storageBodyHTML(S.storage)}</div>`;
}
function cleanupLine(){
  const at = S.settings.last_cleanup_at;
  const last = at ? `Última execução: ${fmtDT(at)}, ${S.settings.last_cleanup_files || 0} ${S.settings.last_cleanup_files === 1 ? 'arquivo removido' : 'arquivos removidos'}.` : 'Ainda não executou.';
  return `<div class="status-line" style="--n:4"><span class="dot"></span><span><b>Limpeza automática:</b> todo dia, por volta das 03h, os anexos de solicitações concluídas há mais de ${PURGE_DAYS} dias são apagados. ${esc(last)}</span></div>`;
}
function meterHTML(key, title, desc, used, limit, n){
  return `<div class="meter" style="--n:${n}">
    <div class="meter-top"><div><b>${title}</b><p>${desc}</p></div>
      <div class="meter-num"><span class="mn-used" data-bytes="${used == null ? '' : used}">${used == null ? '—' : fmtBytes(used)}</span> <span class="muted">de ${fmtBytes(limit)}</span></div></div>
    <div class="mbar"><i data-meter="${key}" style="width:0"></i></div>
    <div class="meter-foot"><span class="mpct" id="pct-${key}">${used == null ? 'Medindo...' : ''}</span></div>
  </div>`;
}
function storageBodyHTML(d){
  const p = LIMITS;
  if(d && d.error) return `<div class="status-line"><span class="dot"></span><span>Não foi possível medir: ${esc(d.error)}</span></div>`;
  const loading = !d;
  const rows = (list, labels, key) => (list || []).map((x, i) => `<li style="--i:${i}"><span>${esc(labels[x[key]] || x[key])}${x.count != null ? ` <span class="muted">· ${x.count} ${x.count === 1 ? 'arquivo' : 'arquivos'}</span>` : ''}</span><b>${fmtBytes(x.bytes)}</b></li>`).join('');
  return `${meterHTML('db', 'Banco de dados', 'Solicitações, equipe, histórico e configurações', loading ? null : d.db_bytes, p.db, 1)}
    ${meterHTML('files', 'Arquivos', 'Anexos do formulário e fotos de perfil', loading ? null : d.files_bytes, p.files, 2)}
    ${loading ? '' : `<div class="st-split" style="--n:3">
      <div><h4>Arquivos por pasta</h4><ul class="st-list">${rows(d.buckets, BUCKET_LABEL, 'bucket') || '<li><span class="muted">Nenhum arquivo ainda.</span></li>'}</ul></div>
      <div><h4>Maiores tabelas</h4><ul class="st-list">${rows((d.tables || []).slice(0, 5), TABLE_LABEL, 'table')}</ul></div>
    </div>
    ${cleanupLine()}
    <p class="fine st-note">Medido às ${new Date(d.measured_at).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}. O banco inclui a estrutura interna do Postgres, por isso nunca começa do zero. O painel do Supabase (Settings → Usage) mede a média do mês e pode mostrar números um pouco diferentes.</p>`}`;
}
async function loadStorage(){
  const btn = $('#st-refresh'); if(btn){ btn.disabled = true; btn.classList.add('spinning'); }
  let data;
  try{
    const {data:d, error} = await sb.rpc('storage_usage');
    if(error) throw error;
    data = d;
  }catch(e){
    data = {error: /function|does not exist|não existe/i.test(e.message || '') ? 'a função storage_usage não existe no banco. Rode o schema.sql de novo no SQL Editor do Supabase.' : (e.message || String(e))};
  }
  S.storage = data;
  if(S.modal !== 'settings' || S.settingsTab !== 'storage') return;
  const body = $('#st-body'); if(body) body.innerHTML = storageBodyHTML(data);
  const b2 = $('#st-refresh'); if(b2){ b2.disabled = false; b2.classList.remove('spinning'); }
  requestAnimationFrame(() => requestAnimationFrame(animateMeters));
}
/* enche as barras e conta os números para cima */
function animateMeters(){
  const d = S.storage; if(!d || d.error) return;
  const p = LIMITS;
  [['db', d.db_bytes, p.db], ['files', d.files_bytes, p.files]].forEach(([k, used, limit]) => {
    const bar = document.querySelector(`[data-meter="${k}"]`); if(!bar) return;
    const pct = limit > 0 ? used / limit * 100 : 0;
    bar.style.width = Math.max(pct > 0 ? 1.2 : 0, Math.min(100, pct)) + '%';
    bar.className = pct >= 90 ? 'over' : pct >= 75 ? 'near' : '';
    const label = $('#pct-' + k);
    if(label){ label.textContent = (pct < 0.1 && pct > 0 ? '< 0,1' : pct.toFixed(pct < 10 ? 1 : 0).replace('.', ',')) + '% usado' + (pct >= 90 ? ' · perto do limite' : ''); label.classList.toggle('over', pct >= 90); }
    const num = bar.closest('.meter').querySelector('.mn-used');
    if(num && !REDUCE){
      const t0 = performance.now(), dur = 900;

  });

async function sendNotification(){
  const n = S.ntf; if(!n || n.busy) return;
  const t = byId(n.taskId); if(!t) return;
  const tpl = curTpl();
  if(n.editing){ const ta = $('#ntf-text'); if(ta) n.text = ta.value; }
  const text = (n.text ?? fillTemplate(tpl, t)).trim();
  const fail = msg => { n.err = msg; renderNotify(); };
  if(!text) return fail('Escreva a mensagem antes de enviar.');
  if(/\[[^\]\n]+\]/.test(text)) return fail('Complete os trechos entre [colchetes] antes de enviar.');
  n.busy = true; n.err = ''; renderNotify();
  const payload = {task_id:t.id, template:tpl.id, text};
  let res;
  try{
    if(DEMO) res = await sb.demoNotify(payload);
    else {
      const r = await fetch(NOTIFY_API, {method:'POST', headers: await authHeaders(), body: JSON.stringify(payload)});
      res = await r.json().catch(() => ({error:'Resposta inválida do servidor (' + r.status + ')'}));
      if(!r.ok && !res.error) res.error = 'Falha ao enviar (' + r.status + ')';
    }
  }catch(e){ res = {error:'Não foi possível falar com o servidor: ' + e.message}; }
  n.busy = false;
  if(!S.ntf || S.ntf !== n) return; // janela foi fechada enquanto enviava
  if(res.error || res.ok === false){ fail(res.error || 'Falha ao enviar.'); loadNotifs(t); return; }
  renderNotify();
  const main = $('#ntf-main');
  if(main){ main.insertAdjacentHTML('beforeend', successPaneHTML(res)); confettiBurst(main.querySelector('.confetti')); }
  toast('Notificação enviada pelo SeaTalk.');
  loadNotifs(t);
  setTimeout(() => { if(S.modal === 'notify') closeModal(); }, 1700);
}

const THEME_KEY = 'rex-theme';
const themeBtn = (cls='') => `<button class="theme-btn ${cls}" data-action="theme" aria-label="Alternar entre modo claro e escuro" title="Alternar tema">
  <svg class="i-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 11.8A6.8 6.8 0 1 1 8.2 3.5a5.4 5.4 0 0 0 8.300 8.300z"/></svg>
  <svg class="i-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.500v1.800M10 15.700v1.800M2.500 10h1.800M15.700 10h1.800M4.700 4.700l1.300 1.300M14 14l1.300 1.300M15.300 4.700L14 6M6 14l-1.300 1.300"/></svg>
</button>`;

function getTheme(){ return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'; }
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
}

async function toggleTheme(btn){
  if(S.themeBusy) return;
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  if(!document.startViewTransition || REDUCE){ applyTheme(next); return; }
  S.themeBusy = true;
  const r = btn.getBoundingClientRect(), root = document.documentElement;
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  root.classList.add('theme-reveal');
  const vt = document.startViewTransition(() => applyTheme(next));
  try{
    await vt.ready;
    root.animate(
      {clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${R}px at ${x}px ${y}px)`]},
      {duration:750, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards', pseudoElement:'::view-transition-new(root)'}
    );
    await vt.finished;
  }catch(e){ applyTheme(next); }
  root.classList.remove('theme-reveal');
  S.themeBusy = false;
}

      <div class="seg">${CHANNELS.map(([v,l])=>`<label><input type="checkbox" name="e_chan" value="${esc(v)}" ${ch.includes(v)?'checked':''}><span>${esc(l)}</span></label>`).join('')}</div>
    </div>
    <label class="f">Descrição<textarea class="in" name="description" required maxlength="10000">${esc(t.description)}</textarea></label>
    <p class="msg" id="emsg"></p>
    <div class="row"><button type="button" class="btn" data-action="cancel-edit">Cancelar</button><button class="btn primary" type="submit">Salvar alterações</button></div>
  </form>`;
}

function saveEdit(form){
  const msg = t => { $('#emsg').textContent = t; };
  const fd = new FormData(form), freq = fd.get('e_freq');
  const chans = freq === 'Não' ? [] : fd.getAll('e_chan');
  const patch = {
    name: String(fd.get('name')).trim(),
    requester_email: String(fd.get('requester_email')).trim().toLowerCase(),
    impacted_structures: String(fd.get('impacted_structures')).trim(),
    project_type: fd.get('project_type'),
    needs_interaction: fd.get('e_needs') === 'Sim',
    report_frequency: freq,
    report_channels: chans,
    description: String(fd.get('description')).trim()
  };
  if(!patch.name || !patch.impacted_structures || !patch.description || !/^\S+@\S+\.\S+$/.test(patch.requester_email)) return msg('Preencha todos os campos corretamente.');
  if(freq !== 'Não' && !chans.length) return msg('Escolha ao menos uma opção para os reports.');
  S.editing = false;
  patchTask(form.dataset.id, patch);
  toast('Solicitação atualizada.');
}


/* ===================== FOTOS DE PERFIL ===================== */
function avatar(p, cls=''){
  if(!p) return `<span class="avatar noav ${cls}"></span>`;
  const url = S.avatars[p.email];
  return `<span class="avatar ${cls}" title="${esc(p.name)}">${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : esc(initials(p.name))}</span>`;
}
const meHTML = () => `${avatar(S.me)}<b>${esc(S.me.name)}</b><small>${ROLES[S.me.role]}</small>`;

async function loadAvatars(){
  const {data, error} = await sb.from('avatars').select('email,path');
  if(error || !data) return;
  S.avatarPaths = Object.fromEntries(data.map(r => [r.email, r.path]));
  S.avatars = {};
  if(!data.length) return;
  const {data:urls} = await sb.storage.from('avatares').createSignedUrls(data.map(r => r.path), 3600);
  (urls || []).forEach(u => {
    if(!u.signedUrl) return;
    const em = Object.keys(S.avatarPaths).find(k => S.avatarPaths[k] === u.path);
    if(em) S.avatars[em] = u.signedUrl;
  });
}

function resizeSquare(file, size){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('falha ao processar a imagem')), 'image/jpeg', .88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem inválida')); };
    img.src = url;
  });
}

function openProfile(){
  const p = S.me, has = !!S.avatars[p.email];
  $('#modal').innerHTML = `<div class="scrim enter-in" data-action="close-modal" style="z-index:50"></div>
  <div class="modal" role="dialog" aria-label="Sua foto">
    <h2>Sua foto</h2>
    <div class="prof-row">${avatar(p,'lg')}<div><b style="color:var(--strong)">${esc(p.name)}</b><div class="muted">${esc(p.email)}</div></div></div>
    <p class="fine" style="margin:14px 0 0">A foto aparece nas tarefas atribuídas a você. A imagem é recortada em quadrado.</p>
    <p class="msg" id="pmsg"></p>
    <div class="row">${has ? '<button class="btn danger" type="button" data-action="remove-photo">Remover foto</button>' : ''}<span class="spacer"></span>
      <button type="button" class="btn" data-action="close-modal">Fechar</button>
      <label class="btn primary" for="photo-in" style="cursor:pointer">Escolher foto</label>
      <input type="file" id="photo-in" accept="image/png,image/jpeg,image/webp" hidden></div>
  </div>`;
}

async function setAvatar(file){
  const msg = t => { const m = $('#pmsg'); if(m) m.textContent = t; };
  if(!/^image\//.test(file.type)) return msg('Escolha um arquivo de imagem.');
  msg('Enviando...');
  try{
    const em = S.me.email, blob = await resizeSquare(file, 256), old = S.avatarPaths[em];
    const path = `${em}/${Date.now()}.jpg`;
    const up = await sb.storage.from('avatares').upload(path, blob, {contentType:'image/jpeg'});
    if(up.error) throw up.error;
    const {error} = await sb.from('avatars').upsert({email: em, path, updated_at: new Date().toISOString()});
    if(error) throw error;
    if(old) await sb.storage.from('avatares').remove([old]);
    await loadAvatars(); render(); openProfile();
    toast('Foto atualizada.');
  }catch(err){ msg('Não foi possível salvar a foto: ' + (err.message || err)); }
}

async function removeAvatar(){
  const em = S.me.email, old = S.avatarPaths[em];
  const {error} = await sb.from('avatars').delete().eq('email', em);
  if(error){ const m = $('#pmsg'); if(m) m.textContent = 'Não foi possível remover: ' + error.message; return; }
  if(old) await sb.storage.from('avatares').remove([old]);
  await loadAvatars(); render(); openProfile();
  toast('Foto removida.');
}

setInterval(() => { if(S.me && route() === 'app') loadAvatars().then(render); }, 45 * 60 * 1000);


/* ===================== DROPDOWN PROPRIO ===================== */
let M = null;
const CK = '<svg class="ck" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.800 3.800 7.200-8"/></svg>';

function bumpA(t, field){
  if(S.bump && S.bump.id === t.id && S.bump.field === field){
    const el = Date.now() - S.bump.t0;
    if(el < 600) return {cls:' bump', st:`animation-delay:-${el}ms;`};
    S.bump = null;
  }
  return {cls:'', st:''};
}

function updateTrigger(btn, sel){
  const o = sel.options[sel.selectedIndex];
  btn.textContent = o ? o.textContent : '';
  if(sel.dataset.field === 'status') btn.className = btn.className.replace(/\bst-\w+/, 'st-' + sel.value);
  if(sel.dataset.field === 'complexity') btn.className = btn.className.replace(/\bcx-\w+/, 'cx-' + sel.value);
}

function enhanceSelects(){
  document.querySelectorAll('select:not([data-enh]):not(#as)').forEach(sel => {
    sel.dataset.enh = '1';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = sel.className + ' dd-trigger';
    btn.style.cssText = sel.style.cssText;
    btn.setAttribute('aria-haspopup', 'listbox');
    btn.setAttribute('aria-expanded', 'false');
    const al = sel.getAttribute('aria-label'); if(al) btn.setAttribute('aria-label', al);
    btn._sel = sel;
    sel.before(btn);
    sel.classList.add('dd-native'); sel.setAttribute('aria-hidden', 'true'); sel.tabIndex = -1;
    updateTrigger(btn, sel);
  });
}
new MutationObserver(enhanceSelects).observe(document.body, {childList:true, subtree:true});
enhanceSelects();

function openMenu(btn){
  closeMenu(true);
  const sel = btn._sel; if(!sel || !btn.isConnected) return;
  const f = sel.dataset.field;
  const kind = f === 'status' ? 'status' : f === 'complexity' ? 'cx' : f === 'assignee_id' ? 'person' : 'plain';
  const menu = document.createElement('div');
  menu.className = 'dd-menu'; menu.setAttribute('role', 'listbox');
  menu.innerHTML = [...sel.options].map((o, i) => {
    const v = o.value, label = esc(o.textContent);
    let inner = label;
    if(kind === 'status') inner = `<span class="pill stpill st-${esc(v)}">${label}</span>`;
    else if(kind === 'cx') inner = `<span class="tag cx-${esc(v)}">${label}</span>`;
    else if(kind === 'person') inner = `${avatar(prof(v))}<span>${label}</span>`;
    const ph = kind === 'plain' && v === '' ? ' ph' : '';
    return `<button type="button" role="option" class="dd-item${i === sel.selectedIndex ? ' sel' : ''}${ph}" data-i="${i}" style="--i:${Math.min(i, 12)}" aria-selected="${i === sel.selectedIndex}">${inner}${CK}</button>`;
  }).join('');
  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect();
  menu.style.minWidth = Math.max(r.width, 190) + 'px';
  const w = menu.offsetWidth, h = menu.offsetHeight;
  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  let top = r.bottom + 6;
  if(top + h > innerHeight - 8){
    if(r.top - 6 - h > 8){ top = r.top - 6 - h; menu.classList.add('up'); }
    else menu.style.maxHeight = Math.max(120, innerHeight - top - 12) + 'px';
  }
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
  btn.setAttribute('aria-expanded', 'true');
  M = {btn, menu, sel, idx: Math.max(0, sel.selectedIndex)};
  S.menuOpen = true;
  hlMenu(M.idx);
}

function hlMenu(i){
  if(!M) return;
  const items = [...M.menu.querySelectorAll('.dd-item')];
  M.idx = Math.max(0, Math.min(items.length - 1, i));
  items.forEach((el, k) => el.classList.toggle('kb', k === M.idx));
  if(items[M.idx]) items[M.idx].scrollIntoView({block:'nearest'});
}

function closeMenu(now){
  if(!M) return;
  const m = M; M = null; S.menuOpen = false;
  m.btn.setAttribute('aria-expanded', 'false');
  if(now || REDUCE) m.menu.remove(); else { m.menu.classList.add('out'); setTimeout(() => m.menu.remove(), 130); }
  if(m.btn.isConnected) m.btn.focus({preventScroll:true});
  if(S.pending){ S.pending = false; setTimeout(render, 60); }
}

function pickMenu(i){
  if(!M) return;
  const {sel, btn} = M, changed = sel.selectedIndex !== i;
  closeMenu();
  if(!changed || !sel.options[i]) return;
  sel.selectedIndex = i;
  updateTrigger(btn, sel);
  sel.dispatchEvent(new Event('change', {bubbles:true}));
}

document.addEventListener('mousedown', e => {
  if(M && !e.target.closest('.dd-menu') && !e.target.closest('.dd-trigger')) closeMenu();
});
document.addEventListener('keydown', e => {
  if(!M){
    if(e.key === 'ArrowDown' && e.target.matches && e.target.matches('.dd-trigger')){ e.preventDefault(); openMenu(e.target); }
    return;
  }
  const k = e.key;
  if(k === 'ArrowDown') hlMenu(M.idx + 1);
  else if(k === 'ArrowUp') hlMenu(M.idx - 1);
  else if(k === 'Home') hlMenu(0);
  else if(k === 'End') hlMenu(999);
  else if(k === 'Enter' || k === ' ') pickMenu(M.idx);
  else if(k === 'Escape' || k === 'Tab') closeMenu();
  else return;
  e.preventDefault(); e.stopPropagation();
}, true);
document.addEventListener('scroll', e => {
  if(M && !(e.target.nodeType === 1 && e.target.closest('.dd-menu'))) closeMenu(true);
}, true);
window.addEventListener('resize', () => closeMenu(true));

/* ===================== INICIO ===================== */
async function boot(){
  S.bootRoute = route();
  if(route() === 'form'){ renderForm(); return; }
  const authErr = authErrorFromUrl();
  const {data:{session}} = await sb.auth.getSession();
  S.session = session;
  if(!session){ renderLogin('email', '', authErr); return; }
  $('#app').innerHTML = skeletonHTML();
  await loadAll();
  if(!S.me){ renderNoAccess(); return; }
  if(S.view === 'equipe' && !isMgr()) S.view = 'lista';
  renderShell();
  subscribe();
}

function wireAuth(){
  sb.auth.onAuthStateChange((ev, session) => {
    if(ev !== 'SIGNED_IN' && ev !== 'SIGNED_OUT') return;
    if(ev === 'SIGNED_OUT' && S.channel){ sb.removeChannel(S.channel); S.channel = null; }
    const uid = session && session.user ? session.user.id : null;
    const cur = S.session && S.session.user ? S.session.user.id : null;
    if(route() === 'app' && uid !== cur) setTimeout(boot, 0);
  });
}

window.addEventListener('hashchange', () => {
  // a biblioteca do Supabase limpa o #access_token da URL ao voltar do Google: isso não é troca de tela
  if(route() === S.bootRoute && (S.me || S.session)) return;
  S.openId = null; boot();
});

setInterval(() => {
  if(S.me && route() === 'app' && !document.hidden && S.view !== 'equipe'){
    const a = document.activeElement;
    if(!S.menuOpen && !(a && a.matches && a.matches('#content select'))) renderContent();
  }
}, 60000);

(async () => {
  if(!(await loadConfig())) return;   // sem configuração: tela de aviso
  wireAuth();
  boot();
})();
