<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REX - Center of Excellence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Ccircle cx=%2710%27 cy=%2710%27 r=%279%27 fill=%27%232f9e6b%27/%3E%3Cpath d=%27M5.8 10.4l2.7 2.7 5.7-5.9%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.8%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<!-- Cliente oficial do Supabase. Usado fora do modo demonstração, com a configuração vinda de /api/config. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<meta name="color-scheme" content="light dark">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("rex-theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{
  /* modo claro: cappuccino (padrao) */
  --bg:#E9DCCB;--bg2:#F1E7DA;--card:#FBF6EE;--input:#F6EEE2;--btn:#DCCAB4;--btn-h:#D1BDA3;
  --hover:rgba(74,52,38,.08);--line:rgba(74,52,38,.16);--line-2:rgba(74,52,38,.3);
  --text:#4A3526;--strong:#2A1D14;--muted:#6E5A4A;
  --blue:#5A3A28;--blue-h:#46301F;--blue-rgb:90,58,40;--green:#1f7a4d;--red:#b3342a;--amber:#8a5a0b;
  --danger:#b3362b;--danger-b:rgba(179,54,43,.4);
  --avatar-bg:#7d634f;--avatar-ink:#fff;--stat-bg:rgba(255,255,255,.4);--bar:rgba(74,52,38,.13);
  --scrim:rgba(40,25,15,.38);--sk1:#dfcfba;--sk2:#ead9c4;
  --st-nova:#e1d5c4;--st-nova-i:#5b4a3c;--st-em_analise:#e4dcf4;--st-em_analise-i:#4b3a7a;
  --st-em_andamento:#d6e5f8;--st-em_andamento-i:#1f4a85;--st-em_validacao:#f4e2b6;--st-em_validacao-i:#7a5410;
  --st-concluida:#d3ead9;--st-concluida-i:#1f5a3c;
  --cx-baixa:#d3e8de;--cx-baixa-i:#255a47;--cx-media:#f3dfae;--cx-media-i:#7a5410;--cx-alta:#f3cec8;--cx-alta-i:#8a2f27;
  --c-nova:#FBF6EE;--c-em_analise:#F1EBFA;--c-em_andamento:#E6EFFB;--c-em_validacao:#FBF0D6;--c-concluida:#E3F2E7;
  color-scheme:light;
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#191919;--bg2:#202020;--card:#252525;--input:#202020;--btn:#2f2f2f;--btn-h:#3a3a3a;
  --hover:rgba(255,255,255,.055);--line:rgba(255,255,255,.094);--line-2:rgba(255,255,255,.22);
  --text:rgba(255,255,255,.81);--strong:#fff;--muted:rgba(255,255,255,.46);
  --blue:#2383e2;--blue-h:#1b74cc;--blue-rgb:35,131,226;
  --green:#4cb782;--red:#eb5757;--amber:#e0b04a;
  --danger:#ff7b7b;--danger-b:rgba(255,123,123,.4);
  --avatar-bg:#4a4a4a;--avatar-ink:#fff;--stat-bg:rgba(255,255,255,.02);--bar:rgba(255,255,255,.1);
  --scrim:rgba(0,0,0,.45);--sk1:#212121;--sk2:#2c2c2c;
  --st-nova:#4a4a4a;--st-nova-i:#fff;--st-em_analise:#51407f;--st-em_analise-i:#fff;
  --st-em_andamento:#2f4f86;--st-em_andamento-i:#fff;--st-em_validacao:#7a5c1c;--st-em_validacao-i:#fff;
  --st-concluida:#2b5a43;--st-concluida-i:#fff;
  --cx-baixa:#3d6b5a;--cx-baixa-i:#fff;--cx-media:#8a6a1f;--cx-media-i:#fff;--cx-alta:#94453e;--cx-alta-i:#fff;
  --c-nova:#252525;--c-em_analise:#2a2442;--c-em_andamento:#1d2b47;--c-em_validacao:#3a3120;--c-concluida:#1f3a2c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
option{background:var(--card);color:var(--strong)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.muted,.mut{color:var(--muted)}
.spacer{flex:1}

/* barra superior */
.topbar{height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid transparent}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--strong)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.me b{color:var(--text);font-weight:500}
.tbtn{background:none;border:0;border-radius:4px;padding:4px 8px;color:var(--muted);font-size:13px}
.tbtn:hover{background:var(--hover);color:var(--text)}

/* banner */
.banner{width:100%;overflow:hidden;background-size:cover;background-position:center;background-color:#3b7fb0}
.banner svg{width:100%;height:100%;display:block}

/* pagina */
.page{padding:0 96px 80px}
.title{display:flex;align-items:center;gap:14px;margin:34px 0 14px}
.title h1{margin:0;font-size:40px;line-height:1.2;font-weight:700;color:var(--strong);letter-spacing:-.01em}
.check{flex:none}
.views{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.vtab{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:999px;padding:5px 12px;color:var(--muted);font-weight:500;font-size:14px}
.vtab:hover{background:var(--hover)}
.vtab.on{background:var(--btn);color:var(--strong)}
.toolbar{display:flex;align-items:center;gap:8px;margin:8px 0 6px}
.search{display:flex;align-items:center;gap:6px;background:transparent;border-radius:4px;padding:3px 8px;color:var(--muted)}
.search:focus-within,.search:hover{background:var(--hover)}
.search input{background:none;border:0;outline:0;width:170px;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.plainsel{appearance:none;background:transparent;border:0;border-radius:4px;padding:4px 8px;color:var(--muted);cursor:pointer}
.plainsel:hover{background:var(--hover)}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:4px;cursor:pointer}
.chk:hover{background:var(--hover)}
.chk input{accent-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:4px;padding:0 12px;height:30px;font-weight:500;font-size:14px;background:var(--btn);color:var(--text);text-decoration:none}
.btn:hover{background:var(--btn-h)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-h)}
.btn.primary:disabled{opacity:.6;cursor:default}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger-b)}
.btn.danger:hover{background:rgba(255,123,123,.1)}
.btn.sm{height:26px;padding:0 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--hover)}

/* tabela */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th{font-weight:400;font-size:13px;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th .ic{vertical-align:-3px;margin-right:6px}
td{padding:5px 8px;border-bottom:1px solid var(--line);height:38px;vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
td.nm{font-weight:600;color:var(--strong);max-width:420px;overflow:hidden;text-overflow:ellipsis}
td.nm .num{color:var(--muted);font-weight:400;font-size:12px;margin-right:8px}
.rel{color:var(--muted);font-size:12px;margin-left:8px}
.due.late{color:var(--red)}
.due.warn{color:var(--amber)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}

/* pills e tags */
.pill{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 10px;font-size:12.5px;color:var(--ink,#fff);border:0;white-space:nowrap}
.stpill{padding-left:20px;background-repeat:no-repeat;background-image:radial-gradient(circle at 10px 50%,var(--dot) 3.5px,transparent 4px)}
select.pill,select.tag{appearance:none;cursor:pointer;field-sizing:content;min-width:70px}
.tag{display:inline-flex;align-items:center;height:22px;border-radius:3px;padding:0 8px;font-size:12.5px;color:var(--ink,#fff);border:0;white-space:nowrap}
.st-nova{--dot:#a0a0a0;--ink:var(--st-nova-i);background-color:var(--st-nova)}
.st-em_analise{--dot:#9b7cf0;--ink:var(--st-em_analise-i);background-color:var(--st-em_analise)}
.st-em_andamento{--dot:#4f93ee;--ink:var(--st-em_andamento-i);background-color:var(--st-em_andamento)}
.st-em_validacao{--dot:#e0a52a;--ink:var(--st-em_validacao-i);background-color:var(--st-em_validacao)}
.st-concluida{--dot:#3aa874;--ink:var(--st-concluida-i);background-color:var(--st-concluida)}
.cx-baixa{--ink:var(--cx-baixa-i);background-color:var(--cx-baixa)}
.cx-media{--ink:var(--cx-media-i);background-color:var(--cx-media)}
.cx-alta{--ink:var(--cx-alta-i);background-color:var(--cx-alta)}
.asg{display:flex;align-items:center;gap:8px}
.asg select{appearance:none;background:transparent;border:0;border-radius:4px;color:var(--text);cursor:pointer;padding:3px 4px;min-width:120px;field-sizing:content}
.asg select:hover{background:var(--hover)}
.avatar{width:20px;height:20px;border-radius:50%;background:var(--avatar-bg);color:var(--avatar-ink);font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar.sm{width:18px;height:18px;font-size:9px}
.avatar.noav{background:transparent;border:1px dashed var(--line-2)}

/* kanban */
.board{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding:10px 0 30px}
.col{flex:0 0 272px;border-radius:8px;padding:4px 4px 8px;min-height:140px}
.col.over{background:rgba(var(--blue-rgb),.1);outline:1px dashed rgba(var(--blue-rgb),.6)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.col-h .n{color:var(--blue);font-size:13px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.card:hover{filter:brightness(1.12)}
.card.drag{opacity:.4}
.card.c-em_analise{background:var(--c-em_analise)}
.card.c-em_andamento{background:var(--c-em_andamento)}
.card.c-em_validacao{background:var(--c-em_validacao)}
.card.c-concluida{background:var(--c-concluida)}
.card-t{display:flex;gap:8px;align-items:flex-start;color:var(--strong);font-weight:600;font-size:15px;line-height:1.35}
.card-t svg{flex:none;margin-top:2px}
.card-m{display:flex;align-items:center;gap:6px;margin:8px 0 0 26px;font-size:12px;color:var(--text)}
.card-f{display:flex;align-items:center;gap:8px;margin:8px 0 0 26px;flex-wrap:wrap}
.card-f .due{font-size:12px}
.empty-col{color:var(--muted);font-size:13px;padding:6px 8px}

/* gaveta de detalhes */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.d-top{display:flex;align-items:center;padding:8px 14px}
.d-body{padding:6px 40px 40px;overflow-y:auto;flex:1}
.d-body h2{margin:6px 0 20px;font-size:30px;line-height:1.25;color:var(--strong);font-weight:700}
.d-num{color:var(--muted);font-size:13px}
.prop{display:grid;grid-template-columns:170px 1fr;align-items:center;min-height:34px;gap:8px}
.pl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.pv{min-width:0;overflow-wrap:anywhere}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
h3{font-size:14px;font-weight:600;color:var(--strong);margin:0 0 8px}
.desc{white-space:pre-wrap;margin:0}
.att{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;text-decoration:none;color:var(--text)}
.att:hover{background:var(--hover)}
.att small{color:var(--muted)}
.att.off{opacity:.5}
.d-foot{padding:12px 40px;border-top:1px solid var(--line)}

/* modal e formularios */
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{margin:0 0 14px;font-size:18px;color:var(--strong)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
label.f{display:block;margin-bottom:16px;font-size:13px;color:var(--muted)}
label.f>span.req{color:var(--red)}
.in{display:block;width:100%;margin-top:6px;background:var(--input);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--strong);font-size:14px}
.in:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 2px rgba(var(--blue-rgb),.3)}
textarea.in{min-height:140px;resize:vertical}
select.in{appearance:auto}
.q{font-size:13px;color:var(--muted);margin:0 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--input);color:var(--text);font-size:13.5px}
.seg input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.seg input:disabled+span{opacity:.4}
.files{display:block;border:1px dashed var(--line-2);border-radius:8px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.files:hover{background:var(--hover)}
.files input{display:none}
.flist{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--text)}
.msg{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--danger)}
.msg.ok{color:var(--green)}
.fine{font-size:12px;color:var(--muted)}
.narrow{max-width:720px;margin:0 auto;padding:0 20px 60px}
.auth-card{max-width:400px;margin:44px auto 0;padding:0 20px}
.auth-card h1{font-size:30px;margin:0 0 4px;color:var(--strong)}
.done-box{text-align:center;padding:60px 0}
.done-box h2{color:var(--strong);font-size:26px;margin:14px 0 6px}

#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13.5px}
.toast.err{border-color:var(--danger-b);color:var(--danger)}

.team td.acts{text-align:right}
.team tr.off td{opacity:.5}
.team tbody tr{cursor:default}
.hint{margin:14px 8px;color:var(--muted);font-size:13px}


/* ===== tema e transicao circular ===== */
.theme-btn{position:relative;width:32px;height:32px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background-color .15s ease,color .15s ease,transform .1s ease}
.theme-btn:hover{background:var(--hover);color:var(--strong)}
.theme-btn:active{transform:scale(.92)}
.theme-btn svg{position:absolute;transition:transform .55s cubic-bezier(.2,.9,.3,1),opacity .3s ease}
:root[data-theme="light"] .theme-btn .i-sun{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme="dark"] .theme-btn .i-moon{opacity:0;transform:rotate(90deg) scale(.4)}
.theme-float{position:fixed;top:12px;right:14px;z-index:35;background:rgba(0,0,0,.38);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.theme-float:hover{background:rgba(0,0,0,.55);color:#fff}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.theme-reveal::view-transition-new(root){clip-path:circle(0px at 100% 0)}

.meet-box{margin:-6px 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--stat-bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;animation:slideUp .3s ease backwards}
.meet-box[hidden]{display:none}
.meet-box p{margin:0;flex:1;min-width:200px}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:72px;height:72px;font-size:24px}
button.me{background:none;border:0;border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit}
button.me:hover{background:var(--hover)}
.prof-row{display:flex;align-items:center;gap:14px}
/* ===== dropdown proprio ===== */
.dd-native{display:none!important}
.dd-trigger{font:inherit;cursor:pointer;text-align:left;display:inline-flex;align-items:center;transition:background-color .2s ease,color .2s ease,filter .15s ease,transform .1s ease}
.dd-trigger:active{transform:scale(.97)}
.dd-trigger::after{content:"";flex:none;width:5px;height:5px;margin-left:8px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:0;transition:opacity .15s ease,transform .2s ease}
.dd-trigger:hover::after,.dd-trigger[aria-expanded="true"]::after{opacity:.75}
.dd-trigger[aria-expanded="true"]::after{transform:translateY(1px) rotate(225deg)}
.pill.dd-trigger,.tag.dd-trigger{border:0}
.pill.dd-trigger:hover,.tag.dd-trigger:hover{filter:brightness(1.12)}
.in.dd-trigger{display:flex;justify-content:space-between;align-items:center;width:100%}
.in.dd-trigger::after{opacity:.55;margin-left:auto}
.asg .dd-trigger{background:transparent;border:0;border-radius:4px;color:var(--text);padding:3px 6px;min-width:120px}
.asg .dd-trigger:hover{background:var(--hover)}
.dd-menu{position:fixed;z-index:90;min-width:180px;max-height:320px;overflow-y:auto;padding:6px;border-radius:10px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.18);transform-origin:top left;animation:ddIn .18s cubic-bezier(.2,.9,.3,1) backwards}
.dd-menu.up{transform-origin:bottom left;animation-name:ddInUp}
.dd-menu.out{animation:ddOut .12s ease forwards}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;color:var(--text);cursor:pointer;font:inherit;animation:ddItem .22s ease backwards;animation-delay:calc(var(--i,0)*20ms + 30ms);transition:background-color .12s ease}
.dd-item:hover,.dd-item.kb{background:var(--hover)}
.dd-item.sel{color:var(--strong);font-weight:600}
.dd-item.ph{color:var(--muted)}
.dd-item .ck{margin-left:auto;flex:none;opacity:0;transform:scale(.5);transition:opacity .2s ease,transform .25s cubic-bezier(.2,1.4,.4,1)}
.dd-item.sel .ck{opacity:1;transform:none}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ddInUp{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ddOut{to{opacity:0;transform:translateY(-4px) scale(.97)}}
@keyframes ddItem{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(.8);filter:brightness(1.35)}55%{transform:scale(1.1)}100%{transform:scale(1);filter:none}}
@keyframes segPop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.bump{animation:bump .5s cubic-bezier(.2,1.3,.4,1)}
.seg span{transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .12s ease}
.seg label:active span{transform:scale(.95)}
.seg input:checked+span{animation:segPop .28s cubic-bezier(.2,1.4,.4,1)}
@media (max-width:900px){
  .page{padding:0 16px 60px}
  .title h1{font-size:28px}
  .prop{grid-template-columns:130px 1fr}
  .d-body,.d-foot{padding-left:20px;padding-right:20px}
  .me b,.me small{display:none}
}

/* ===== animacoes ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes drawerOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(48px)}}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-47%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes scrimOut{to{opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes cardDrop{0%{transform:scale(.93)}60%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(var(--blue-rgb),.65)}100%{box-shadow:0 0 0 16px rgba(var(--blue-rgb),0)}}
@keyframes rowFlash{0%{background:rgba(var(--blue-rgb),.28)}100%{background:transparent}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

.banner{animation:fadeIn .7s ease backwards}
.title{animation:slideUp .55s .1s cubic-bezier(.2,.8,.2,1) backwards}
.views{animation:slideUp .55s .18s cubic-bezier(.2,.8,.2,1) backwards}
.toolbar{animation:fadeIn .5s .5s ease backwards}
.auth-card{animation:slideUp .5s ease backwards}
#f-req>*{animation:slideUp .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0)*40ms + 120ms)}
#channel-box:not([hidden]){animation:slideUp .3s ease backwards}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:10px 0 14px}
.stats[hidden]{display:none}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--stat-bg);animation:slideUp .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k,0)*70ms + 280ms)}
.stat .v{font-size:28px;font-weight:700;color:var(--strong);line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px}
.stat .bar{height:4px;border-radius:2px;background:var(--bar);margin-top:10px;overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;border-radius:2px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.stat .bar i.b-blue{background:var(--blue)}
.stat .bar i.b-red{background:var(--red)}
.stat .bar i.b-green{background:var(--green)}
.stat.hot .v{color:var(--red)}
.sk{border-radius:6px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 40%,var(--sk1) 60%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}

.enter tbody tr{animation:rowIn .38s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*30ms + 120ms)}
.enter .col-h{animation:fadeIn .4s ease backwards;animation-delay:calc(var(--c,0)*70ms)}
.enter .card{animation:rowIn .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--c,0)*70ms + var(--i,0)*45ms + 100ms)}
tbody tr.flash{animation:rowFlash 1.2s ease-out}
.card.flash{animation:cardDrop .5s cubic-bezier(.2,1.2,.4,1),glow 1s ease-out}

.card{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.card.drag{transform:rotate(1.5deg) scale(.98)}
tbody tr{transition:background-color .15s ease}
.btn,.tbtn,.vtab,.chk,.plainsel{transition:background-color .15s ease,color .15s ease,transform .1s ease}
.btn:active{transform:scale(.97)}
.search input{transition:width .22s ease}
.search:focus-within input{width:260px}
.col{transition:background-color .15s ease,outline-color .15s ease}
select.pill,select.tag{transition:filter .15s ease}
select.pill:hover,select.tag:hover{filter:brightness(1.15)}

.scrim.enter-in{animation:fadeIn .2s ease backwards}
.scrim.out{animation:scrimOut .18s ease forwards}
.drawer.enter-in{animation:drawerIn .28s cubic-bezier(.2,.8,.2,1) backwards}
.drawer.out{animation:drawerOut .18s ease forwards}
.modal{animation:modalIn .22s cubic-bezier(.2,.9,.3,1) backwards}
.toast{animation:toastIn .28s cubic-bezier(.2,.9,.3,1) backwards}
.toast.out{animation:toastOut .2s ease forwards}
.done-box svg{animation:pop .5s cubic-bezier(.2,1.2,.4,1) backwards}
.done-box .tick{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .45s .25s ease forwards}

/* ===== tokens extras ===== */
:root{--warn-bg:#f7e9c7;--warn-ink:#6b4a07;--warn-line:rgba(138,90,11,.35);--warn-rgb:224,165,42;--sheet-shadow:0 30px 90px rgba(40,25,15,.35)}
:root[data-theme="dark"]{--warn-bg:#3a3120;--warn-ink:#f0c96a;--warn-line:rgba(224,176,74,.45);--sheet-shadow:0 30px 90px rgba(0,0,0,.7)}

/* ===== botoes de icone da barra ===== */
.tbtn.icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.tbtn.icon svg{transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.tbtn.icon:hover .i-gear{transform:rotate(90deg)}
.tbtn.notify{display:inline-flex;align-items:center;gap:6px}
.tbtn.notify:hover .i-bell{animation:ring .7s cubic-bezier(.36,.07,.19,.97) both;transform-origin:50% 2px}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}

/* ===== chip de capacidade (titulo) ===== */
.cap-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border:1px solid var(--warn-line);border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px;font-weight:600;cursor:pointer;position:relative;animation:chipIn .5s cubic-bezier(.2,1.3,.4,1) backwards;font-family:inherit}
.cap-chip::before{content:"";position:absolute;inset:-1px;border-radius:999px;border:1px solid var(--warn-line);animation:halo 2.2s ease-out infinite;pointer-events:none}
.cap-chip .fl{animation:flicker 1.6s ease-in-out infinite;transform-origin:50% 100%;display:inline-flex}
.cap-chip:hover{filter:brightness(1.05)}
@keyframes halo{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
@keyframes flicker{0%,100%{transform:scaleY(1) rotate(0)}30%{transform:scaleY(1.08) rotate(-3deg)}60%{transform:scaleY(.94) rotate(3deg)}}
@keyframes chipIn{from{opacity:0;transform:translateX(-8px) scale(.8)}to{opacity:1;transform:none}}

/* ===== janela grande (configuracoes / notificar) ===== */
.scrim.blur{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,calc(100% - 28px));max-height:min(720px,calc(100% - 28px));display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sheet-shadow);overflow:hidden;animation:sheetIn .42s cubic-bezier(.2,1.1,.3,1) backwards}
.sheet.sm{width:min(780px,calc(100% - 28px))}
.sheet.out,.modal.out{animation:sheetOut .18s ease forwards}
@keyframes sheetIn{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes sheetOut{to{opacity:0;transform:translate(-50%,-48%) scale(.97)}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:16px;color:var(--strong)}
.sheet-head .sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.xbtn{width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background-color .15s,transform .35s cubic-bezier(.2,.9,.3,1),color .15s}
.xbtn:hover{background:var(--hover);color:var(--strong);transform:rotate(90deg)}
.sheet-body{display:grid;grid-template-columns:210px 1fr;min-height:0;flex:1}
.sheet-nav{border-right:1px solid var(--line);padding:12px;background:var(--bg2);position:relative}
.sheet-nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;color:var(--text);font-size:13.5px;position:relative;z-index:1;transition:color .2s}
.sheet-nav button.on{color:var(--strong);font-weight:600}
.sheet-nav button[disabled]{color:var(--muted);opacity:.6;cursor:default}
.sheet-nav .ind{position:absolute;left:12px;right:12px;height:34px;border-radius:7px;background:var(--btn);z-index:0;transition:top .3s cubic-bezier(.2,1,.3,1)}
.soon{margin-left:auto;font-size:10.5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.sheet-main{padding:18px 24px 24px;overflow-y:auto;min-height:0;position:relative}
.sheet-main h3{font-size:18px;margin:0 0 4px;color:var(--strong)}
.sheet-main .lead{margin:0 0 14px;color:var(--muted);font-size:13.5px}
@media (max-width:720px){
  .sheet-body{grid-template-columns:1fr}
  .sheet-nav{display:flex;gap:6px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .sheet-nav .ind{display:none}
  .sheet-nav button{width:auto;white-space:nowrap}
  .sheet-main{padding:16px}
}

/* ===== preferencias ===== */
.pref{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-top:1px solid var(--line);animation:slideUp .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0)*60ms + 60ms)}
.pref.first{border-top:0}
.pref-l b{display:block;color:var(--strong);font-weight:600;font-size:14px}
.pref-l p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:46ch}
.pref-c{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--input);overflow:hidden}
.step button{width:32px;height:32px;border:0;background:transparent;color:var(--text);font-size:18px;line-height:1;transition:background-color .15s,transform .1s}
.step button:hover{background:var(--hover)}
.step button:active{transform:scale(.85)}
.step button:disabled{opacity:.3;cursor:default}
.step output{min-width:42px;text-align:center;font-weight:600;color:var(--strong);font-variant-numeric:tabular-nums;display:inline-block}
.step output.tick{animation:numTick .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes numTick{0%{transform:translateY(-8px);opacity:0}100%{transform:none;opacity:1}}
.capbar{width:160px;height:5px;border-radius:3px;background:var(--bar);overflow:hidden}
.capbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--blue);transition:width .9s cubic-bezier(.2,.8,.2,1),background-color .3s}
.capbar i.near{background:var(--amber)}
.capbar i.over{background:var(--red)}
.cap-note{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;transition:color .3s}
.cap-note.over{color:var(--red);font-weight:600}
.switch{position:relative;width:46px;height:26px;border-radius:999px;background:var(--btn);border:0;padding:0;cursor:pointer;transition:background-color .35s ease;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .38s cubic-bezier(.2,1.4,.4,1),width .22s ease}
.switch:active::after{width:26px}
.switch[aria-checked="true"]{background:linear-gradient(90deg,#d6552a,#e8842a)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[aria-checked="true"]:active::after{transform:translateX(14px)}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);height:20px;opacity:0;transition:opacity .25s}
.saved.show{opacity:1}
.saved svg .tick{stroke-dasharray:20;stroke-dashoffset:20}
.saved.show svg .tick{animation:draw .4s .05s ease forwards}
.status-line{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--stat-bg);border:1px solid var(--line);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;transition:background-color .3s}
.dot.on{background:var(--amber);animation:dotPulse 1.6s ease-out infinite}
@keyframes dotPulse{from{box-shadow:0 0 0 0 rgba(var(--warn-rgb),.6)}to{box-shadow:0 0 0 8px rgba(var(--warn-rgb),0)}}

/* ===== notificar ===== */
.tpl-list{display:flex;flex-direction:column;gap:2px;position:relative}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--text);position:relative;z-index:1;animation:ddItem .3s ease backwards;animation-delay:calc(var(--i,0)*35ms + 80ms)}
.tpl b{font-size:13.5px;color:var(--strong);font-weight:500;line-height:1.3}
.tpl small{color:var(--muted);font-size:12px}
.tpl.on b{font-weight:600}
.tpl[disabled]{opacity:.5;cursor:default}
.tpl .soon{margin:3px 0 0}
.tpl-ind{position:absolute;left:12px;right:12px;border-radius:8px;background:var(--btn);z-index:0;opacity:0;transition:top .32s cubic-bezier(.2,1,.3,1),height .32s cubic-bezier(.2,1,.3,1),opacity .2s}
.tpl-ind.show{opacity:1}
.tgts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tgt{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:8px 12px;text-align:left;color:var(--text);flex:1 1 170px;min-width:0;transition:border-color .2s,background-color .2s,transform .15s,box-shadow .2s}
.tgt:hover{background:var(--hover)}
.tgt:active{transform:scale(.98)}
.tgt.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(var(--blue-rgb),.22);background:var(--card)}
.tgt b{display:block;font-size:13px;color:var(--strong);font-weight:600}
.tgt small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt[disabled]{opacity:.45;cursor:default}
.tgt .rad{width:16px;height:16px;border-radius:50%;border:1.6px solid var(--line-2);flex:none;display:grid;place-items:center;transition:border-color .2s}
.tgt .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);transform:scale(0);transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.tgt.on .rad{border-color:var(--blue)}
.tgt.on .rad::after{transform:scale(1)}
.preview{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--input);min-height:200px;transition:border-color .2s,box-shadow .2s}
.preview.edit{border-color:var(--blue);box-shadow:0 0 0 2px rgba(var(--blue-rgb),.22)}
.preview pre{margin:0;padding:14px 16px;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--strong);line-height:1.55;font-size:13.5px}
.preview textarea{display:block;width:100%;min-height:230px;padding:14px 16px;border:0;background:transparent;resize:vertical;outline:0;line-height:1.55;font-size:13.5px;color:var(--strong)}
.preview.swap pre{animation:swapIn .35s cubic-bezier(.2,.9,.3,1)}
@keyframes swapIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.preview mark{background:var(--warn-bg);color:var(--warn-ink);border-radius:3px;padding:0 2px}
.pv-tools{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pv-tools .msg{margin:0;flex:1 1 180px;min-height:0}
.fill-hint{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:6px 10px;margin-bottom:10px;animation:slideUp .35s ease backwards}
.send{min-width:180px;justify-content:center}
.send.busy{pointer-events:none}
.send .sp{display:none;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.send.busy .sp{display:inline-block}
.send.busy .lbl{opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.success-pane{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--card);z-index:2;animation:fadeIn .25s ease;text-align:center;padding:20px}
.success-pane h3{margin:10px 0 0;font-size:20px}
.success-pane p{margin:0;color:var(--muted);font-size:13.5px}
.success-pane .pop{animation:pop .5s cubic-bezier(.2,1.2,.4,1) backwards}
.success-pane .tick{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .25s ease forwards}
.confetti{position:absolute;left:50%;top:42%;width:0;height:0;pointer-events:none}
.confetti i{position:absolute;width:8px;height:12px;border-radius:2px;background:var(--c);animation:conf 1.15s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:var(--d)}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.group-pick{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:720px){.sheet-nav.tpl-list{flex-direction:row;gap:4px}.tpl{flex:0 0 auto;max-width:220px;white-space:normal}.tpl small,.tpl-ind{display:none}.tpl.on{background:var(--btn)}}

/* ===== aviso de capacidade (formulario) ===== */
.warn-box{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;margin:0 0 24px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);position:relative;animation:warnIn .55s cubic-bezier(.2,1.2,.3,1) backwards}
.warn-box[hidden]{display:none}
.warn-box::after{content:"";position:absolute;inset:0;border-radius:inherit;animation:warnGlow 2.6s ease-in-out infinite;pointer-events:none}
.warn-box svg{flex:none;margin-top:1px;animation:flicker 1.8s ease-in-out infinite;transform-origin:50% 100%}
.warn-box b{display:block;margin-bottom:2px;font-size:14px}
.warn-box p{margin:0;font-size:13.5px;line-height:1.5}
@keyframes warnIn{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes warnGlow{0%,100%{box-shadow:0 0 0 0 rgba(var(--warn-rgb),0)}50%{box-shadow:0 0 0 6px rgba(var(--warn-rgb),.14)}}

/* ===== historico de notificacoes (gaveta) ===== */
.notif{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px;background:var(--stat-bg);animation:slideUp .35s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.notif summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notif summary::-webkit-details-marker{display:none}
.notif summary b{color:var(--strong);font-weight:600;font-size:13.5px}
.notif .when{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.notif pre{margin:10px 0 0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);font-size:13px;line-height:1.5;border-top:1px solid var(--line);padding-top:10px;animation:slideUp .3s ease}
.notif.failed{border-color:var(--danger-b)}
.chip{display:inline-flex;align-items:center;height:20px;border-radius:999px;padding:0 8px;font-size:11.5px;background:var(--btn);color:var(--text);white-space:nowrap}
.chip.err{background:transparent;border:1px solid var(--danger-b);color:var(--danger)}
.chip.ok{background:var(--st-concluida);color:var(--st-concluida-i)}
.h3-row{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.h3-row h3{margin:0}

/* ===== notificar: destinatário, modelos do time ===== */
.to-line{display:flex;align-items:center;gap:8px;padding:9px 12px;margin:0 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--input);font-size:13.5px;animation:slideUp .35s ease backwards}
.to-line b{color:var(--strong);font-weight:600}
.to-line svg{flex:none;color:var(--muted)}
.tpl-add{display:flex;align-items:center;gap:7px;width:100%;margin-top:6px;padding:9px 10px;border:1.5px dashed var(--line-2);border-radius:8px;background:none;color:var(--muted);font-size:13px;text-align:left;position:relative;z-index:1;transition:color .2s,border-color .2s,background-color .2s,transform .15s;animation:ddItem .3s ease backwards;animation-delay:calc(var(--i,0)*35ms + 80ms)}
.tpl-add:hover{color:var(--strong);border-color:var(--blue);background:rgba(var(--blue-rgb),.06)}
.tpl-add:active{transform:scale(.98)}
.tpl-add svg{transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.tpl-add:hover svg{transform:rotate(90deg)}
.tpl-add.on{color:var(--strong);border-style:solid;border-color:transparent}
.var-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.var-chip{border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:999px;padding:3px 10px;font-size:12px;transition:background-color .15s,border-color .15s,transform .12s;animation:ddItem .3s ease backwards}
.var-chip:hover{border-color:var(--blue);background:rgba(var(--blue-rgb),.08)}
.var-chip:active{transform:scale(.92)}
#tpl-text{min-height:170px}
#tpl-live{min-height:0}
#tpl-live pre{color:var(--text)}
.danger-txt{color:var(--danger)}
.auto-banner{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 14px;border-radius:10px;background:var(--st-concluida);color:var(--st-concluida-i);font-size:13.5px;animation:warnIn .5s cubic-bezier(.2,1.2,.3,1) backwards}
.auto-banner span{flex:1}
.auto-banner .btn{color:inherit}
#ntf-main.swap-in{animation:swapIn .3s cubic-bezier(.2,.9,.3,1)}
.sheet-nav .tpl{align-items:flex-start;text-align:left}
.sheet-nav .tpl small{text-align:left}
@media (max-width:720px){.tpl-add{width:auto;flex:0 0 auto;margin:0;white-space:nowrap}}

/* ===== armazenamento ===== */
.sheet-main.swap-in{animation:swapIn .32s cubic-bezier(.2,.9,.3,1)}
.meter{padding:16px 0;border-top:1px solid var(--line);animation:slideUp .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0)*70ms + 60ms)}
.meter-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:10px}
.meter-top b{display:block;color:var(--strong);font-size:14px;font-weight:600}
.meter-top p{margin:3px 0 0;color:var(--muted);font-size:13px}
.meter-num{white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.meter-num .mn-used{font-size:18px;font-weight:700;color:var(--strong)}
.mbar{height:10px;border-radius:6px;background:var(--bar);overflow:hidden;position:relative}
.mbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--blue),#6fa8f5);transition:width 1.1s cubic-bezier(.2,.8,.2,1),background .3s;position:relative;overflow:hidden}
.mbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shimmer 2.4s 1.1s ease-in-out infinite}
.mbar i.near{background:linear-gradient(90deg,var(--amber),#efc160)}
.mbar i.over{background:linear-gradient(90deg,var(--red),#f08a8a)}
@keyframes shimmer{to{transform:translateX(100%)}}
.meter-foot{margin-top:6px;font-size:12.5px;color:var(--muted);min-height:16px}
.mpct.over{color:var(--red);font-weight:600}
.st-split{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-top:14px;border-top:1px solid var(--line);animation:slideUp .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0)*70ms + 60ms)}
.st-split h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.st-list{list-style:none;margin:0;padding:0}
.st-list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line);animation:ddItem .3s ease backwards;animation-delay:calc(var(--i,0)*40ms + 250ms)}
.st-list li b{font-weight:600;color:var(--strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.st-note{margin:16px 0 0}
#st-refresh.spinning .i-refresh{animation:spin .9s linear infinite}
@media (max-width:720px){.st-split{grid-template-columns:1fr}.meter-top{flex-direction:column;align-items:flex-start;gap:6px}}

/* ===== login ===== */
.gbtn{width:100%;justify-content:center;height:38px;gap:9px}
.gbtn:disabled{opacity:.7;cursor:default}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:16px 0 14px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}

/* ===== micro-interacoes gerais ===== */
.btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
.btn:not(.primary) .ripple{background:rgba(var(--blue-rgb),.18)}
@keyframes ripple{to{transform:scale(2.8);opacity:0}}
.toast{position:relative;overflow:hidden}
.toast::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--blue);transform-origin:left;animation:toastBar 4.2s linear forwards}
.toast.err::after{background:var(--danger)}
@keyframes toastBar{to{transform:scaleX(0)}}
.demo-box{position:fixed;left:12px;bottom:12px;z-index:70;background:#2f2f2f;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 10px;font-size:12.5px;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toastIn .4s .8s cubic-bezier(.2,.9,.3,1) backwards}
.demo-box select{background:#202020;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:2px 4px;margin-left:4px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
'use strict';

/* ===================== CONFIGURACAO ===================== */
/* Nenhuma chave fica neste arquivo. Publicado na Vercel, o site busca a configuração em /api/config,
   que lê as variáveis de ambiente SUPABASE_URL e SUPABASE_ANON_KEY (GUIA.md, passo 4.3).
   Aberto direto do computador, ou com ?demo=1 no endereço, roda em MODO DEMONSTRAÇÃO com dados fictícios. */
const CONFIG_API = '/api/config';
const APP_TITLE = 'REX - Center of Excellence';
const BANNER_URL = 'banner.jpg';                        // imagem do banner (arquivo ao lado do index.html)
const NOTIFY_API = '/api/seatalk';                      // função serverless da Vercel que fala com o SeaTalk
/* Formas de entrar no REX (a lista de quem pode entrar continua sendo a tabela profiles).
   google: exige o provedor Google ligado no Supabase (GUIA.md, passo 2.7) e só funciona no site publicado (https). */
const AUTH = {google: true, email: true};
const GOOGLE_HD = 'shopee.com';                         // domínio sugerido na tela de escolha de conta do Google ('' para não filtrar)
const DEMO = location.protocol === 'file:' || /[?&]demo=1\b/.test(location.search);
const CFG = {supabaseUrl:'', supabaseKey:''};   // preenchido por loadConfig()

/* ===================== CONSTANTES ===================== */
const STATUS = [
  {id:'nova', label:'Não iniciado'},
  {id:'em_analise', label:'Em análise'},
  {id:'em_andamento', label:'Em andamento'},
  {id:'em_validacao', label:'Em validação'},
  {id:'concluida', label:'Concluído'}
];
const COMPLEXITY = [
  {id:'baixa', label:'Baixa', sla:'24h'},
  {id:'media', label:'Média', sla:'1 semana'},
  {id:'alta', label:'Alta', sla:'1 mês'}
];
const SLA_MS = {baixa:24*3600e3, media:7*86400e3, alta:30*86400e3};
const TYPES = ['Planilha','Automação','Dashboard','Sistema','Extração de dados','Outro'];
const MAX_FILE_MB = 20;   // formulário aceita 1 arquivo de até 20 MB
const FREQ = [['Não','Não'],['Semanal','Semanais'],['Quinzenal','Quinzenais'],['Mensal','Mensais']];
const CHANNELS = [['Reuniões','Reuniões'],['Grupo no SeaTalk','Grupo no SeaTalk'],['E-mail','Por e-mail']];
const MEETING_URL = 'https://calendar.app.google/qmYtyYeNRqLDdbfJ8'; // agenda para quem escolher Reuniões
const ROLES = {owner:'Owner', admin:'Admin', viewer:'Viewer'};
const DISCLAIMER = 'O time de Recruiting Excellence tem um SLA de 24h para solicitações de baixa complexidade, 1 semana para média complexidade e 1 mês para alta complexidade.';
const TEAM = 'Recruiting Excellence';

/* Preferências de capacidade (tela de Configurações). Os valores reais ficam na tabela settings. */
const DEFAULT_SETTINGS = {id:1, max_alta:3, max_media:5, max_total:10, burnout:false};
/* Limites do plano gratuito do Supabase (aba Armazenamento das Configurações) */
const MB = 1024 * 1024, GB = 1024 * MB;
const LIMITS = {db: 500 * MB, files: 1 * GB};
const PURGE_DAYS = 30;    // anexos de solicitações concluídas há mais que isso são apagados (api/cleanup.js)
const CAPACITY_WARNING = 'Nosso time está com a capacidade no limite neste momento. Sua solicitação será atendida normalmente, mas os prazos padrão podem se estender. Vamos te manter informado(a).';

/* Modelos de notificação enviados pelo SeaTalk. Variáveis: {numero} {nome} {status} {prazo} {responsavel}
   {complexidade} {solicitante} {link_agenda} {remetente} {time}. Trechos entre [colchetes] pedem edição antes do envio. */
const TEMPLATES = [
  {id:'atualizacao', label:'Atualização', hint:'Status, responsável e prazo atuais',
   text:`Olá! Passando para dar uma atualização sobre a sua solicitação #{numero} – {nome}.

Status atual: {status}
Responsável: {responsavel}
Prazo previsto: {prazo}

Qualquer dúvida, é só responder por aqui.
— {remetente}, {time}`}
];
/* variáveis que os modelos podem usar (inseridas com um clique no editor de modelos) */
const TPL_VARS = [
  ['numero','Número'], ['nome','Nome do projeto'], ['status','Status'], ['prazo','Prazo'], ['responsavel','Responsável'],
  ['complexidade','Complexidade'], ['solicitante','E-mail do solicitante'], ['remetente','Seu nome'], ['time','Nome do time']
];


/* ===================== MODO DEMONSTRACAO (dados ficticios, sem Supabase) ===================== */
const MOCK = {email:'fellipe.menezes@shopee.com', pending:null, listeners:[]};
function mockClient(){
  const H = 3600e3, D = 24*H, now = Date.now();
  const uid = n => '00000000-0000-4000-8000-' + String(n).padStart(12,'0');
  const profiles = [
    {id:uid(1), email:'fellipe.menezes@shopee.com', name:'Fellipe Menezes', role:'owner', active:true},
    {id:uid(2), email:'victor.gsantana@shopee.com', name:'Victor Gimenes', role:'admin', active:true},
    {id:uid(3), email:'nicole.ogura@shopee.com', name:'Nicole Ogura', role:'viewer', active:true},
    {id:uid(4), email:'wesley.nlima@shopee.com', name:'Wesley Lima', role:'viewer', active:true}
  ].map(p => ({...p, created_at:new Date(now-90*D).toISOString()}));
  const tasks = []; let num = 0;
  const mk = (name, type, status, cx, asg, ageH, freq='Não', ch=null) => {
    const created = now - ageH*H;
    const due = created + SLA_MS[cx];
    tasks.push({
      id: crypto.randomUUID(), number: ++num, name, requester_email:'recruiter'+num+'@shopee.com',
      impacted_structures:'Recrutamento Brasil, TA Tech', project_type:type, needs_interaction: num%2===0,
      report_frequency:freq, report_channels: ch ? [].concat(ch) : [],
      description:'Contexto da solicitação.\nPrecisamos de uma solução para acompanhar os indicadores do time com atualização automática e visão por recruiter.',
      attachments: num%3===0 ? [{path:'x/briefing.pdf', name:'briefing.pdf', size:182000}] : [],
      status, complexity:cx, assignee_id: asg ? uid(asg) : null,
      created_at:new Date(created).toISOString(), due_at:new Date(due).toISOString(),
      completed_at: status==='concluida' ? new Date(created + Math.min(SLA_MS[cx]*0.8, 20*D)).toISOString() : null,
      updated_at:new Date(now).toISOString()
    });
  };
  mk('Dashboard pra Priscila de Associate PM','Dashboard','concluida','alta',2,24*40);
  mk('Automação da Offer Tracker','Automação','concluida','alta',1,24*38,'Mensal',['Reuniões','E-mail']);
  mk('Dashboard - Sourcing','Dashboard','concluida','alta',2,24*35);
  mk('Automação - KYE PCD','Automação','concluida','media',1,24*12);
  mk('Implementação do Inhire','Sistema','em_andamento','alta',1,24*20,'Semanal','Grupo no SeaTalk');
  mk('MIRAI','Sistema','em_validacao','alta',1,24*25);
  mk('Franco+PCD','Automação','em_andamento','alta',1,24*12);
  mk('Dashboards PCD','Dashboard','em_andamento','alta',2,24*9,'Quinzenal','E-mail');
  mk('Automação - Disparo automático no Sea Talk','Automação','em_andamento','media',1,24*4);
  mk('Planilha de capacity por recruiter','Planilha','em_andamento','baixa',3,20);
  mk('Extração de vagas abertas do ATS','Extração de dados','em_analise','media',null,26);
  mk('Heloisa e Ana','Planilha','nova','baixa',null,5);
  mk('Mapeamento de referências','Planilha','nova','baixa',null,30);
  const settings = [{...DEFAULT_SETTINGS, max_alta:4, updated_at:new Date(now-2*D).toISOString(), updated_by:'fellipe.menezes@shopee.com',
                     last_cleanup_at:new Date(now-9*H).toISOString(), last_cleanup_files:2}];
  tasks.filter(t => t.status === 'concluida').slice(-1).forEach(t => { t.attachments = []; t.attachments_purged_at = new Date(now-9*H).toISOString(); });
  const notifications = [
    {id:crypto.randomUUID(), task_id:tasks[4].id, template:'atualizacao', channel:'dm', recipient:tasks[4].requester_email, status:'sent', sent_by:'victor.gsantana@shopee.com',
     content:'Olá! Passando para dar uma atualização sobre a sua solicitação #5 – Implementação do Inhire.\n\nStatus atual: Em andamento', created_at:new Date(now-3*D).toISOString()},
    {id:crypto.randomUUID(), task_id:tasks[4].id, template:'atualizacao', channel:'dm', recipient:tasks[4].requester_email, status:'sent', sent_by:'fellipe.menezes@shopee.com',
     content:'Olá! Passando para dar uma atualização sobre a sua solicitação #5 – Implementação do Inhire.\n\nStatus atual: Em análise', created_at:new Date(now-9*D).toISOString()}
  ];
  const templates = [{id:crypto.randomUUID(), label:'Pedido de acesso à base', created_by:'victor.gsantana@shopee.com', created_at:new Date(now-5*D).toISOString(),
    text:'Olá! Para seguir com a solicitação #{numero} – {nome}, precisamos de acesso à base de origem.\n\nPode liberar o acesso de leitura para {remetente}?\n— {time}'}];
  const db = {profiles, tasks, avatars:[], settings, notifications, templates}; const blobs = {};
  const me = () => profiles.find(p => p.email === MOCK.email);
  const clone = o => JSON.parse(JSON.stringify(o));

  function from(tbl){
    const q = {op:'select', patch:null, rows:null, filters:[], single:false, ret:false};
    const b = {
      select(){ if(q.op !== 'select') q.ret = true; return b; },
      order(){ return b; }, limit(){ return b; },
      update(p){ q.op='update'; q.patch=p; return b; },
      insert(r){ q.op='insert'; q.rows=r; return b; },
      upsert(r){ q.op='upsert'; q.rows=r; return b; },
      delete(){ q.op='delete'; return b; },
      eq(k,v){ q.filters.push([k,v]); return b; },
      single(){ q.single=true; return b; },
      maybeSingle(){ q.single=true; q.maybe=true; return b; },
      then(res, rej){ return new Promise(r => setTimeout(r, 120)).then(run).then(res, rej); }
    };
    function run(){
      const arr = db[tbl], m = me();
      const match = r => q.filters.every(([k,v]) => r[k] === v);
      if(q.op === 'select'){
        const d = clone(arr.filter(match));
        if(tbl === 'tasks' || tbl === 'notifications') d.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
        if(q.single) return d.length ? {data:d[0], error:null} : (q.maybe ? {data:null, error:null} : {data:null, error:{message:'Nenhum registro encontrado'}});
        return {data:d, error:null};
      }
      if(q.op === 'update'){
        let hit = arr.filter(match);
        if(tbl === 'tasks' && m && m.role === 'viewer') hit = hit.filter(r => r.assignee_id === m.id);
        hit.forEach(r => {
          if(tbl === 'tasks'){
            const old = {...r}; Object.assign(r, q.patch);
            if(r.complexity !== old.complexity) r.due_at = new Date(new Date(r.created_at).getTime() + SLA_MS[r.complexity]).toISOString();
            if(r.status === 'concluida' && old.status !== 'concluida') r.completed_at = new Date().toISOString();
            if(r.status !== 'concluida') r.completed_at = null;
            r.updated_at = new Date().toISOString();
          } else if(tbl === 'settings'){
            if(!m || !['owner','admin'].includes(m.role)) return;
            Object.assign(r, q.patch, {updated_at:new Date().toISOString(), updated_by:m.email});
          } else Object.assign(r, q.patch);
        });
        if(q.single && !hit.length) return {data:null, error:{message:'Sem permissão para alterar esta tarefa'}};
        return {data: q.single ? clone(hit[0]) : clone(hit), error:null};
      }
      if(q.op === 'insert'){
        const r = q.rows;
        if(tbl === 'profiles'){
          if(profiles.some(p => p.email === r.email)) return {data:null, error:{code:'23505', message:'duplicate'}};
          profiles.push({id:crypto.randomUUID(), active:true, created_at:new Date().toISOString(), ...r});
        } else {
          const created = Date.now();
          tasks.push({...r, number:++num, status:'nova', complexity:'baixa', assignee_id:null,
            created_at:new Date(created).toISOString(), due_at:new Date(created+SLA_MS.baixa).toISOString(),
            completed_at:null, updated_at:new Date(created).toISOString()});
        }
        return {data:null, error:null};
      }
      if(q.op === 'upsert'){
        const key = 'id' in q.rows ? 'id' : 'email';
        const i = arr.findIndex(x => x[key] === q.rows[key]);
        if(i >= 0) arr[i] = {...arr[i], ...q.rows}; else arr.push({...q.rows});
        return {data: q.single ? clone(arr[i >= 0 ? i : arr.length-1]) : null, error:null};
      }
      if(q.op === 'delete'){
        const keep = arr.filter(r => !match(r));
        arr.length = 0; keep.forEach(r => arr.push(r));
        return {data:null, error:null};
      }
    }
    return b;
  }
  const emit = (ev, email) => MOCK.listeners.forEach(cb => cb(ev, email ? {user:{id:'u-'+email, email}} : null));
  const capacity = () => {
    const st = settings[0], open = tasks.filter(t => t.status !== 'concluida');
    const alta = open.filter(t => t.complexity === 'alta').length, media = open.filter(t => t.complexity === 'media').length;
    const ex = {alta: alta > st.max_alta, media: media > st.max_media, total: open.length > st.max_total};
    return {overloaded: st.burnout || ex.alta || ex.media || ex.total, burnout: st.burnout, exceeded: ex};
  };
  return {
    from,
    rpc: async name => {
      await new Promise(r => setTimeout(r, name === 'storage_usage' ? 650 : 150));
      if(name === 'capacity_status') return {data: capacity(), error:null};
      if(name === 'storage_usage') return {data: {
        db_bytes: 31.4 * 1024 * 1024, files_bytes: 268 * 1024 * 1024, files_count: 143,
        buckets: [{bucket:'anexos', bytes: 261 * 1024 * 1024, count: 131}, {bucket:'avatares', bytes: 7 * 1024 * 1024, count: 12}],
        tables: [{table:'tasks', bytes: 1.9 * 1024 * 1024}, {table:'notifications', bytes: 0.6 * 1024 * 1024}, {table:'profiles', bytes: 0.1 * 1024 * 1024}, {table:'settings', bytes: 0.05 * 1024 * 1024}],
        measured_at: new Date().toISOString()}, error:null};
      return {data:null, error:{message:'função desconhecida'}};
    },
    /* simula a função serverless /api/seatalk */
    demoNotify: async p => {
      await new Promise(r => setTimeout(r, 900));
      const t = tasks.find(x => x.id === p.task_id);
      notifications.unshift({id:crypto.randomUUID(), task_id:p.task_id, template:p.template, channel:'dm', status:'sent', sent_by: me() && me().email,
        recipient: t.requester_email, content:p.text, created_at:new Date().toISOString()});
      return {ok:true, channel:'dm', recipient: t.requester_email, demo:true};
    },
    demoCaps: {dm:true},
    auth: {
      getSession: async () => ({data:{session: MOCK.email ? {user:{id:'u-'+MOCK.email, email:MOCK.email}} : null}}),
      signOut: async () => { MOCK.email = null; emit('SIGNED_OUT', null); return {error:null}; },
      signInWithOtp: async ({email}) => {
        if(!profiles.some(p => p.email === email)) return {error:{message:'Database error saving new user'}};
        MOCK.pending = email; return {error:null};
      },
      verifyOtp: async ({email}) => { MOCK.email = email; emit('SIGNED_IN', email); return {error:null}; },
      signInWithOAuth: async () => { MOCK.email = 'fellipe.menezes@shopee.com'; emit('SIGNED_IN', MOCK.email); return {data:{}, error:null}; },
      onAuthStateChange: cb => { MOCK.listeners.push(cb); return {data:{subscription:{unsubscribe(){}}}}; }
    },
    storage: { from: () => ({
      upload: async (path, blob) => { blobs[path] = URL.createObjectURL(blob); return {error:null}; },
      createSignedUrls: async paths => ({data: paths.map(p => ({path:p, signedUrl: blobs[p] || '#'})), error:null}),
      remove: async paths => { paths.forEach(p => delete blobs[p]); return {error:null}; }
    })},
    channel: () => { const c = {on(){ return c; }, subscribe(){ return c; }}; return c; },
    removeChannel: () => {}
  };
}

/* Cliente real (Supabase) ou simulado (demonstração) */
function setupScreen(title, lines){
  document.body.innerHTML = `<div class="auth-card" style="margin-top:80px"><h1>${title}</h1>${lines.map(l => `<p class="muted" style="margin:10px 0">${l}</p>`).join('')}</div>`;
}
let sb = DEMO ? mockClient() : null;
/* Busca a configuração pública em /api/config (variáveis de ambiente da Vercel) e cria o cliente do Supabase */
async function loadConfig(){
  if(DEMO) return true;
  let cfg = null;
  try{ const r = await fetch(CONFIG_API, {cache:'no-store'}); if(r.ok) cfg = await r.json(); }catch(e){ /* tratado abaixo */ }
  if(!cfg || !/^https:\/\/[^/\s]+/.test(cfg.supabaseUrl || '') || !cfg.supabaseKey){
    setupScreen('Falta configurar o Supabase', [
      'O site está publicado, mas <code>/api/config</code> não devolveu a URL e a chave pública do Supabase.',
      'Na Vercel, em <b>Settings → Environment Variables</b>, defina <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> (GUIA.md, passo 4.3) e faça um redeploy.',
      'Nenhuma chave fica no index.html: a tela lê a configuração dessa função.',

function dur(ms){
  const m = Math.max(1, Math.round(ms/60000));
  if(m < 60) return m + ' min';
  const h = Math.floor(m/60);
  if(h < 48) return h + 'h';
  return Math.floor(h/24) + 'd';
}
function slaInfo(t){
  const due = new Date(t.due_at).getTime(), created = new Date(t.created_at).getTime();
  if(t.status === 'concluida'){
    const done = new Date(t.completed_at || t.updated_at).getTime();
    return done <= due ? {cls:'', text:'no prazo', title:'Concluída dentro do prazo'}
                       : {cls:'late', text:'fora do prazo', title:'Concluída após o prazo'};
  }
  const left = due - Date.now();
  if(left < 0) return {cls:'late', text:'venceu há ' + dur(-left), title:'SLA vencido'};
  return {cls: left/(due-created) < .25 ? 'warn' : '', text:'em ' + dur(left), title:'Tempo restante do SLA'};
}

function bannerHTML(h){
  const src = (IS_HTTP && !/^(https?:)?\//.test(BANNER_URL)) ? '/' + BANNER_URL : BANNER_URL; // na Vercel, sempre a partir da raiz
  if(BANNER_URL) return `<div class="banner" style="height:${h}px;background-image:url('${esc(src)}');background-position:center 27%"></div>`;
  let clouds = '', seed = 7;
  const rnd = () => (seed = (seed*9301+49297) % 233280) / 233280;
  for(let r=0; r<7; r++){
    let x = -60 + rnd()*120;
    while(x < 1250){
      const w = 120 + rnd()*260;
      clouds += `<rect x="${x.toFixed(0)}" y="${(14+r*25+rnd()*8).toFixed(0)}" width="${w.toFixed(0)}" height="${(14+rnd()*10).toFixed(0)}" rx="12"/>`;
      x += w + 30 + rnd()*120;
    }
  }
  return `<div class="banner" style="height:${h}px"><svg viewBox="0 0 1600 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27598a"/><stop offset="1" stop-color="#6ea3c6"/></linearGradient></defs>
    <rect width="1600" height="200" fill="url(#sk)"/>

    <polygon points="1190,200 1330,96 1395,62 1450,78 1520,40 1600,74 1600,200" fill="#6a3b30"/>
    <polygon points="1395,62 1450,78 1430,104 1395,92 1372,100" fill="#e6dcc0"/>

}

      </form>`}

    <p class="fine">Quer abrir uma solicitação? <a href="${esc(formUrl())}">Preencha o formulário</a>.</p>
  </div>`;
  const msg = t => { $('#auth-msg').textContent = t; };
  if(!AUTH.email) return;
  if(step==='email'){
    $('#f-email').addEventListener('submit', async e => {
      e.preventDefault();
      const em = e.target.email.value.trim().toLowerCase();
      msg('');
      const {error} = await sb.auth.signInWithOtp({email: em, options:{emailRedirectTo: location.origin+location.pathname, shouldCreateUser:true}});

        msg(/database error|not allowed|signup|email_nao/i.test(error.message)
          ? 'Este e-mail não tem acesso. Peça ao owner para cadastrar você.' : error.message);
        return;
      }
      renderLogin('code', em);
    });
  } else {
    $('#back').addEventListener('click', () => renderLogin());
    $('#f-code').addEventListener('submit', async e => {
      e.preventDefault();
      const {error} = await sb.auth.verifyOtp({email, token: e.target.code.value.trim(), type:'email'});
      if(error) msg('Código inválido ou expirado.');
    });
  }
}

/* Login com Google (OAuth do Supabase). Só funciona no site publicado, não abrindo o arquivo do computador. */
async function loginGoogle(btn){
  const msg = t => { const m = $('#auth-msg'); if(m) m.textContent = t; };
  if(!IS_HTTP) return msg('O login com Google só funciona no site publicado (https). Abra o endereço da Vercel.');
  if(btn){ btn.disabled = true; btn.querySelector('.lbl') && (btn.querySelector('.lbl').textContent = 'Abrindo o Google...'); }
  const queryParams = {prompt:'select_account'};
  if(GOOGLE_HD) queryParams.hd = GOOGLE_HD;
  const {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: appUrl(), queryParams}});
  if(error){ msg(error.message); if(btn) btn.disabled = false; }
}
/* O Supabase volta para o site com o erro na URL quando o e-mail do Google não está cadastrado */
function authErrorFromUrl(){
  const h = new URLSearchParams(location.hash.replace(/^#\/?/, '')), q = new URLSearchParams(location.search);
  const d = h.get('error_description') || q.get('error_description') || h.get('error') || q.get('error');
  if(!d) return '';
  history.replaceState(null, '', location.pathname);
  return /database error|not allowed|signup|email_nao/i.test(d) ? 'Este e-mail não tem acesso. Peça ao owner para cadastrar você.' : d.replace(/\+/g, ' ');
}

  document.querySelectorAll('input[name=report_channel]').forEach(i => { i.disabled = !need; });
  const mb = $('#meet-box');
  if(mb) mb.hidden = !(need && document.querySelector('input[name=report_channel][value="Reuniões"]:checked'));
}

async function submitRequest(form){
  const msg = t => { $('#fmsg').textContent = t; };
  msg('');
  const fd = new FormData(form);
  const need = ['name','requester_email','impacted_structures','project_type','needs_interaction','report_frequency','description'];
  if(need.some(k => !String(fd.get(k)||'').trim())) return msg('Preencha todos os campos obrigatórios.');
  if(!/^\S+@\S+\.\S+$/.test(fd.get('requester_email').trim())) return msg('Informe um e-mail válido.');
  const freq = fd.get('report_frequency');
  if(freq !== 'Não' && !fd.getAll('report_channel').length) return msg('Escolha ao menos uma opção para os reports.');
  const files = [...$('#files').files];
  if(files.length > 1) return msg('Anexe apenas 1 arquivo. Se precisar enviar vários, junte-os em um .zip.');
  if(files.some(f => f.size > MAX_FILE_MB*1024*1024)) return msg(`O arquivo pode ter no máximo ${MAX_FILE_MB} MB.`);

  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const id = crypto.randomUUID();
  const project = fd.get('name').trim();
  const attachments = [];
  try{
    for(let i = 0; i < files.length; i++){
      const f = files[i];
      btn.textContent = 'Enviando anexo...';
      const path = `${id}/${Date.now()}-${safeName(f.name)}`;
      const {error} = await sb.storage.from('anexos').upload(path, f, {contentType: f.type || 'application/octet-stream'});
      if(error) throw error;
      attachments.push({path, name:f.name, size:f.size});
    }
    btn.textContent = 'Registrando solicitação...';
    const row = {
      id,
      name: project,
      requester_email: fd.get('requester_email').trim().toLowerCase(),
      impacted_structures: fd.get('impacted_structures').trim(),
      project_type: fd.get('project_type'),
      needs_interaction: fd.get('needs_interaction') === 'Sim',
      report_frequency: freq,
      report_channels: freq === 'Não' ? [] : fd.getAll('report_channel'),
      description: fd.get('description').trim(),
      attachments
    };
    const {error} = await sb.from('tasks').insert(row);
    if(error) throw error;
    $('.narrow').innerHTML = `<div class="done-box">${I.check(true,48)}<h2>Solicitação enviada</h2>
      <p class="muted">O time vai revisar a complexidade e atribuir um responsável.</p>
      ${(S.cap && S.cap.overloaded) ? `<div style="max-width:560px;margin:22px auto 0;text-align:left">${capWarnHTML(false)}</div>` : ''}
      ${row.report_channels.includes('Reuniões') ? `<p style="margin:20px 0 10px">Deixe um horário marcado na agenda do time</p><a class="btn primary" href="${MEETING_URL}" target="_blank" rel="noopener">Agendar reunião</a>` : ''}
      <button class="btn primary" id="again" style="margin-top:14px">Enviar outra solicitação</button>
      <p class="fine" style="margin-top:44px">${esc(DISCLAIMER)}</p></div>`;
  }catch(err){
    msg('Não foi possível enviar: ' + (err.message || err));
    btn.disabled = false; btn.textContent = 'Enviar solicitação';
  }
}

async function loadAll(){
  const [p, t, c, tp] = await Promise.all([
    sb.from('profiles').select('*').order('name'),
    sb.from('tasks').select('*').order('created_at', {ascending:false}).limit(3000),
    sb.from('settings').select('*').eq('id', 1).maybeSingle(),
    sb.from('templates').select('*').order('created_at')
  ]);
  if(p.error || t.error){ toast('Erro ao carregar dados: ' + (p.error||t.error).message, 'err'); }
  S.profiles = p.data || [];
  S.tasks = t.data || [];
  S.settings = {...DEFAULT_SETTINGS, ...(c.data || {})};
  S.templates = (tp && tp.data) || [];   // modelos criados pelo time (tabela templates)
  const em = (S.session.user.email||'').toLowerCase();
  S.me = S.profiles.find(x => x.email === em && x.active) || null;
  if(S.me) await loadAvatars();
}

async function patchTask(id, patch){
  const t = byId(id); if(!t) return;
  const before = {...t};
  Object.assign(t, patch);
  if('status' in patch) S.flash = {id, t0: Date.now()};
  const bf = ['status','complexity','assignee_id'].find(k => k in patch);
  if(bf) S.bump = {id, field:bf, t0:Date.now()};
  if('complexity' in patch) t.due_at = new Date(new Date(t.created_at).getTime() + SLA_MS[t.complexity]).toISOString();
  if('status' in patch) t.completed_at = patch.status === 'concluida' ? new Date().toISOString() : null;
  render();
  const {data, error} = await sb.from('tasks').update(patch).eq('id', id).select().single();
  if(error){
    Object.assign(t, before); render();
    toast('Não foi possível salvar: ' + error.message, 'err');
    return;
  }
  Object.assign(t, data); render();
  // avançou no processo: abre a janela de notificação já com o modelo de atualização
  const pos = st => STATUS.findIndex(x => x.id === st);
  if('status' in patch && isMgr() && pos(data.status) > pos(before.status)){
    setTimeout(() => { if(!S.modal && byId(id)) openNotify(id, {from: before.status, to: data.status}); }, REDUCE ? 0 : 450);
  }
}

function moveTask(id, status){
  const t = byId(id); if(!t || t.status === status) return;
  if(!canMove(t)) return toast('Você só pode mover tarefas atribuídas a você.', 'err');
  patchTask(id, {status});
}

function subscribe(){
  if(S.channel) return;
  S.channel = sb.channel('tasks-rt').on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, p => {
    if(p.eventType === 'DELETE'){
      S.tasks = S.tasks.filter(t => t.id !== p.old.id);
      if(S.openId === p.old.id) S.openId = null;
    } else {
      const i = S.tasks.findIndex(t => t.id === p.new.id);
      if(i >= 0) S.tasks[i] = p.new; else { S.tasks.unshift(p.new); S.flash = {id:p.new.id, t0:Date.now()}; }
    }
    softRender();
  }).on('postgres_changes', {event:'*', schema:'public', table:'settings'}, p => {
    if(p.new){ S.settings = {...S.settings, ...p.new}; renderCapChip(); if(S.modal === 'settings'){ refreshPrefs(); } }
  }).subscribe();
}

function softRender(){
  const a = document.activeElement;
  if(S.menuOpen || (a && a.matches && a.matches('#content select, #drawer select'))){ S.pending = true; return; }
  render();
}

/* ===================== CAPACIDADE DO TIME ===================== */
function capacity(){
  const st = S.settings, open = S.tasks.filter(t => t.status !== 'concluida');
  const alta = open.filter(t => t.complexity === 'alta').length, media = open.filter(t => t.complexity === 'media').length;
  const ex = {alta: alta > st.max_alta, media: media > st.max_media, total: open.length > st.max_total};
  const reasons = [];
  if(st.burnout) reasons.push('Modo Burnout ligado');
  if(ex.alta) reasons.push(`${alta} de alta complexidade (limite ${st.max_alta})`);
  if(ex.media) reasons.push(`${media} de média complexidade (limite ${st.max_media})`);
  if(ex.total) reasons.push(`${open.length} em aberto no total (limite ${st.max_total})`);
  return {alta, media, total: open.length, ex, over: st.burnout || ex.alta || ex.media || ex.total, reasons};
}
const capStatusText = c => c.over
  ? 'Aviso ativo no formulário: ' + c.reasons.join('; ') + '.'
  : 'Formulário sem aviso. O time está dentro da capacidade combinada.';

function renderCapChip(){
  const slot = $('#cap-slot'); if(!slot) return;
  const c = capacity();
  const label = S.settings.burnout ? 'Modo Burnout' : 'Capacidade no limite';
  const html = !c.over ? '' : isMgr()
    ? `<button class="cap-chip" data-action="settings" title="${esc(c.reasons.join(' · '))}"><span class="fl">${I.flame}</span>${label}</button>`
    : `<span class="cap-chip" title="${esc(c.reasons.join(' · '))}"><span class="fl">${I.flame}</span>${label}</span>`;
  if(slot.innerHTML !== html) slot.innerHTML = html;
}

function filtered(){
  const {q, assignee} = S.f;
  const s = q.trim().toLowerCase().replace(/^#/, '');
  return S.tasks.filter(t => {
    if(assignee === 'me' && t.assignee_id !== S.me.id) return false;
    if(assignee === 'none' && t.assignee_id) return false;
    if(!['all','me','none'].includes(assignee) && t.assignee_id !== assignee) return false;
    if(s && !`${t.number} ${t.name} ${t.project_type} ${t.impacted_structures} ${t.description} ${t.requester_email}`.toLowerCase().includes(s)) return false;
    return true;
  });
}

/* historico de notificacoes enviadas pelo SeaTalk */
async function loadNotifs(t){
  const box = () => $('#notifs');
  const {data, error} = await sb.from('notifications').select('*').eq('task_id', t.id).order('created_at', {ascending:false}).limit(50);
  if(S.openId !== t.id || !box()) return;
  if(error){ box().innerHTML = `<span class="muted">Não foi possível carregar o histórico: ${esc(error.message)}</span>`; return; }
  S.notifs[t.id] = data || [];
  box().innerHTML = notifsHTML(S.notifs[t.id]);
}
const shortName = email => { const p = S.profiles.find(x => x.email === email); return p ? p.name.split(' ')[0] : (email || ''); };
function notifsHTML(list){
  if(!list.length) return '<span class="muted">Nenhuma notificação enviada ainda.</span>';
  return list.map((n, i) => {
    const tpl = allTemplates().find(x => x.id === n.template);
    const label = tpl ? tpl.label : (/^[0-9a-f-]{36}$/i.test(n.template) ? 'Modelo removido' : n.template);
    const ch = {group:'Grupo', webhook:'Canal do time'}[n.channel];   // envios antigos, de antes de o envio ser só direto
    return `<details class="notif${n.status === 'failed' ? ' failed' : ''}" style="--i:${Math.min(i, 10)}">
      <summary><b>${esc(label)}</b>${ch ? `<span class="chip">${ch}</span>` : ''}${n.status === 'failed' ? '<span class="chip err">Falhou</span>' : ''}<span class="when">${fmtDT(n.created_at)}${n.sent_by ? ' · ' + esc(shortName(n.sent_by)) : ''}</span></summary>
      <pre>${esc(n.content)}${n.error ? '\n\nErro: ' + esc(n.error) : ''}</pre></details>`;
  }).join('');
}

async function loadAtt(t){
  const list = t.attachments || [];
  const box = () => $('#att');
  if(!list.length){
    if(box()) box().innerHTML = t.attachments_purged_at
      ? `<span class="muted">Anexo removido automaticamente em ${fmtDT(t.attachments_purged_at)} (${PURGE_DAYS} dias após a conclusão).</span>`
      : '<span class="muted">Sem anexos.</span>';
    return;
  }
  const need = list.filter(a => !S.urls[a.path] || S.urls[a.path].exp < Date.now());
  if(need.length){
    const {data, error} = await sb.storage.from('anexos').createSignedUrls(need.map(a=>a.path), 3600);
    if(!error) data.forEach(d => { if(d.signedUrl) S.urls[d.path] = {url:d.signedUrl, exp: Date.now()+3000e3}; });
  }
  if(S.openId !== t.id || !box()) return;
  box().innerHTML = list.map(a => {
    const u = S.urls[a.path];
    return u ? `<a class="att" href="${esc(u.url)}" target="_blank" rel="noopener"><span>${esc(a.name)}</span><small>${fmtSize(a.size)}</small></a>`
             : `<span class="att off">${esc(a.name)}</span>`;
  }).join('');
}

document.addEventListener('click', async e => {
